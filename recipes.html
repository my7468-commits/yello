<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>酒譜 - yELLO VIP EXCLUSIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Yuji+Syuku&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
.recipe-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; background: #fff; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.recipe-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.1); }
.recipe-card .thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: block; background: #f2e9de; }
.mix-photo { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius); margin: 14px 0 4px; display: block; }
.recipe-card h3 { margin: 0 0 6px; font-size: 1.1rem; }
.recipe-card .meta { color: var(--text-muted); font-size: 0.85rem; }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filter-bar input, .filter-bar select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.98rem; font-family: inherit; background: #fff; color: var(--text); }
.filter-bar input { flex: 1; min-width: 160px; }

/* 調酒模式：大字體、好點選，適合邊調邊看 */
.mix-title { font-size: 1.8rem; margin: 0 0 4px; }
.mix-meta { color: var(--text-muted); margin-bottom: 18px; }
.servings-box { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; font-size: 1.1rem; }
.servings-box button { padding: 8px 16px; font-size: 1.3rem; line-height: 1; }
.servings-box input { width: 70px; text-align: center; font-size: 1.3rem; padding: 6px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; }
.ing-row { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--border); font-size: 1.3rem; cursor: pointer; }
.ing-row input { width: 26px; height: 26px; flex-shrink: 0; }
.ing-row .amt { margin-left: auto; font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
.ing-row.done { opacity: 0.4; text-decoration: line-through; }
.mix-steps { font-size: 1.2rem; line-height: 1.9; padding-left: 28px; }
.mix-steps li { margin-bottom: 8px; }
.mix-section-title { margin: 24px 0 8px; font-size: 1rem; color: var(--text-muted); letter-spacing: 1px; }
.mix-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 28px; }
@media (max-width: 560px) { .ing-row { font-size: 1.15rem; } .mix-title { font-size: 1.5rem; } }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="home.html">yELLO VIP EXCLUSIVE</a>
  <nav class="site-nav">
    <a href="admin.html">店家後台</a>
    <a href="recipes.html" class="active">酒譜</a>
  </nav>
</header>

<main>
  <h1>酒譜</h1>

  <div class="panel" id="loginPanel">
    <div class="field">
      <label for="passwordInput">管理密碼</label>
      <input type="password" id="passwordInput" placeholder="請輸入密碼" />
    </div>
    <button type="button" id="loginBtn">進入酒譜</button>
  </div>

  <!-- 清單 -->
  <div class="panel" id="listPanel" style="display:none;">
    <div class="filter-bar">
      <input type="search" id="searchInput" placeholder="搜尋酒名或材料（例如：檸檬）" />
      <select id="baseFilter"></select>
      <button type="button" id="addBtn">＋ 新增酒譜</button>
      <button type="button" class="secondary" id="refreshBtn">重新整理</button>
      <button type="button" class="secondary" id="importBtn" style="display:none;">匯入經典酒譜</button>
    </div>
    <div id="recipeList" class="recipe-grid"></div>
  </div>

  <!-- 調酒模式（單一酒譜詳情） -->
  <div class="panel" id="detailPanel" style="display:none;"></div>

  <!-- 新增／編輯 -->
  <div class="panel" id="editPanel" style="display:none;">
    <h2 id="editTitle" style="margin-top:0;">新增酒譜</h2>
    <form id="recipeForm">
      <input type="hidden" id="editId" />
      <div class="field">
        <label for="fName">酒名 *</label>
        <input type="text" id="fName" required placeholder="例如：曼哈頓 Manhattan" />
      </div>
      <div class="row-2">
        <div class="field">
          <label for="fBase">基酒</label>
          <select id="fBase"></select>
        </div>
        <div class="field">
          <label for="fMethod">做法</label>
          <select id="fMethod"></select>
        </div>
      </div>
      <div class="field">
        <label for="fGlass">杯型</label>
        <input type="text" id="fGlass" placeholder="例如：古典杯（加大冰塊）" />
      </div>
      <div class="field">
        <label for="fIngredients">材料（一行一項，格式：名稱 | 數量 | 單位）</label>
        <textarea id="fIngredients" rows="6" placeholder="波本威士忌 | 60 | ml&#10;安格仕苦精 | 2 | dash&#10;冰塊 | 適量"></textarea>
      </div>
      <div class="field">
        <label for="fSteps">步驟（一行一步）</label>
        <textarea id="fSteps" rows="5"></textarea>
      </div>
      <div class="field">
        <label for="fGarnish">裝飾</label>
        <input type="text" id="fGarnish" />
      </div>
      <div class="field">
        <label for="fImage">成品圖片（填圖片檔名，或完整圖片網址）</label>
        <input type="text" id="fImage" placeholder="例如：manhattan.jpg" />
      </div>
      <div class="field">
        <label for="fNotes">備註</label>
        <textarea id="fNotes" rows="3"></textarea>
      </div>
      <button type="submit" id="saveBtn">儲存酒譜</button>
      <button type="button" class="secondary" id="cancelEditBtn">取消</button>
    </form>
  </div>
</main>

<footer class="site-footer">© <span id="year"></span> yELLO VIP EXCLUSIVE｜私人酒譜</footer>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();

const BASES = ["威士忌", "琴酒", "伏特加", "蘭姆酒", "龍舌蘭", "白蘭地", "其它"];
const METHODS = ["搖盪", "攪拌", "直調", "其它"];

// 預設經典酒譜：清單上若還沒有，會出現「匯入經典酒譜」按鈕，一鍵補上（已存在的不會覆寫）
const EXTRA_RECIPES = [
  { id: "rc6", name: "內格羅尼 Negroni", base: "琴酒", glass: "古典杯（加大冰塊）", method: "攪拌",
    ingredients: [{ name: "琴酒", amount: 30, unit: "ml" }, { name: "金巴利", amount: 30, unit: "ml" }, { name: "甜苦艾酒", amount: 30, unit: "ml" }],
    steps: "所有材料加冰攪拌約 20 秒\n濾入裝有大冰塊的古典杯\n擠入橙皮油", garnish: "橙皮", notes: "三種材料等比例 1:1:1，好記好調。", image: "" },
  { id: "rc7", name: "瑪格麗特 Margarita", base: "龍舌蘭", glass: "瑪格麗特杯（或古典杯）", method: "搖盪",
    ingredients: [{ name: "白龍舌蘭", amount: 50, unit: "ml" }, { name: "君度橙酒", amount: 20, unit: "ml" }, { name: "萊姆汁", amount: 15, unit: "ml" }],
    steps: "（選用）杯口抹上萊姆汁，沾一圈鹽\n所有材料加冰用力搖盪\n濾入杯中", garnish: "萊姆片", notes: "鹽邊為選用。", image: "" },
  { id: "rc8", name: "威士忌酸 Whisky Sour", base: "威士忌", glass: "古典杯（加冰塊）", method: "搖盪",
    ingredients: [{ name: "波本威士忌", amount: 50, unit: "ml" }, { name: "檸檬汁", amount: 25, unit: "ml" }, { name: "糖漿", amount: 15, unit: "ml" }],
    steps: "所有材料加冰用力搖盪\n濾入裝有冰塊的古典杯", garnish: "櫻桃、橙片", notes: "想要綿密泡沫可加蛋白約 15ml，先不加冰乾搖一次再加冰搖（選用）。", image: "" },
  { id: "rc9", name: "莫希托 Mojito", base: "蘭姆酒", glass: "高球杯", method: "直調",
    ingredients: [{ name: "白蘭姆酒", amount: 45, unit: "ml" }, { name: "萊姆汁", amount: 25, unit: "ml" }, { name: "糖漿", amount: 15, unit: "ml" }, { name: "薄荷葉", amount: 8, unit: "片" }, { name: "蘇打水", amount: null, unit: "補滿" }],
    steps: "杯中放入薄荷葉、糖漿與萊姆汁，輕壓出香氣（不要壓爛）\n加入蘭姆酒與碎冰攪拌\n補滿蘇打水，輕輕攪拌", garnish: "薄荷枝", notes: "", image: "" },
  { id: "rc10", name: "莫斯科騾子 Moscow Mule", base: "伏特加", glass: "銅杯（或高球杯）", method: "直調",
    ingredients: [{ name: "伏特加", amount: 45, unit: "ml" }, { name: "萊姆汁", amount: 15, unit: "ml" }, { name: "薑汁啤酒", amount: 120, unit: "ml" }],
    steps: "杯中裝滿冰塊\n倒入伏特加與萊姆汁\n補上薑汁啤酒，輕輕攪拌", garnish: "萊姆片、薄荷", notes: "薑汁啤酒（ginger beer）與薑汁汽水（ginger ale）不同，前者薑味更辛辣。", image: "" },
  { id: "rc11", name: "湯姆可林 Tom Collins", base: "琴酒", glass: "高球杯（柯林斯杯）", method: "搖盪",
    ingredients: [{ name: "琴酒", amount: 45, unit: "ml" }, { name: "檸檬汁", amount: 25, unit: "ml" }, { name: "糖漿", amount: 15, unit: "ml" }, { name: "蘇打水", amount: null, unit: "補滿" }],
    steps: "琴酒、檸檬汁、糖漿加冰搖盪\n濾入裝滿冰塊的高球杯\n補滿蘇打水，輕輕攪拌", garnish: "檸檬片、櫻桃", notes: "", image: "" },
  { id: "rc12", name: "馬丁尼 Martini", base: "琴酒", glass: "馬天尼杯（先冰杯）", method: "攪拌",
    ingredients: [{ name: "琴酒", amount: 60, unit: "ml" }, { name: "不甜苦艾酒", amount: 10, unit: "ml" }],
    steps: "材料加冰攪拌約 30 秒\n濾入預先冰過的杯中\n（選用檸檬皮時）擠入檸檬皮油", garnish: "橄欖或檸檬皮", notes: "苦艾酒比例依個人口味調整，越少越「Dry」。", image: "" },
  { id: "rc13", name: "蜜蜂的膝蓋 Bee's Knees", base: "琴酒", glass: "馬天尼杯（先冰杯）", method: "搖盪",
    ingredients: [{ name: "琴酒", amount: 50, unit: "ml" }, { name: "檸檬汁", amount: 20, unit: "ml" }, { name: "蜂蜜糖漿", amount: 15, unit: "ml" }],
    steps: "所有材料加冰用力搖盪\n雙重過濾入預先冰過的杯中\n擠入檸檬皮油", garnish: "檸檬皮", notes: "蜂蜜糖漿：蜂蜜與熱水 1:1 攪拌溶解後放涼。", image: "" }
];

const loginPanel = document.getElementById("loginPanel");
const listPanel = document.getElementById("listPanel");
const detailPanel = document.getElementById("detailPanel");
const editPanel = document.getElementById("editPanel");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const searchInput = document.getElementById("searchInput");
const baseFilter = document.getElementById("baseFilter");
const listEl = document.getElementById("recipeList");

baseFilter.innerHTML = '<option value="">全部基酒</option>' + BASES.map((b) => `<option value="${b}">${b}</option>`).join("");
document.getElementById("fBase").innerHTML = BASES.map((b) => `<option value="${b}">${b}</option>`).join("");
document.getElementById("fMethod").innerHTML = METHODS.map((m) => `<option value="${m}">${m}</option>`).join("");

let password = "";
let recipes = [];
let currentId = null;
let servings = 1;
let checked = new Set();

if (!isWebhookConfigured()) {
  loginBtn.disabled = true;
  showToast("尚未設定 config.js 的 WEBHOOK_URL");
}

/* ---------- 螢幕常亮（調酒時手濕也不會鎖屏） ---------- */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (err) { /* 不支援或被拒絕就算了 */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && currentId) requestWakeLock();
});

/* ---------- 登入與載入 ---------- */
async function loadRecipes() {
  const result = await fetchRemoteRecipes(password);
  if (!result.ok) {
    showToast(result.reason === "密碼錯誤" ? "密碼錯誤" : "讀取失敗，請確認 Apps Script 已重新部署");
    return false;
  }
  recipes = result.recipes;
  return true;
}

loginBtn.addEventListener("click", async () => {
  const pw = passwordInput.value.trim();
  if (!pw) { showToast("請輸入密碼"); return; }
  password = pw;
  loginBtn.disabled = true;
  loginBtn.textContent = "登入中...";
  const ok = await loadRecipes();
  loginBtn.disabled = false;
  loginBtn.textContent = "進入酒譜";
  if (ok) {
    loginPanel.style.display = "none";
    listPanel.style.display = "block";
    renderList();
  }
});
passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loginBtn.click(); });

document.getElementById("refreshBtn").addEventListener("click", async () => {
  if (await loadRecipes()) { renderList(); showToast("已重新整理"); }
});

/* ---------- 清單 ---------- */
function updateImportBtn() {
  const missing = EXTRA_RECIPES.filter((x) => !recipes.some((r) => r.id === x.id));
  const btn = document.getElementById("importBtn");
  btn.style.display = missing.length ? "inline-block" : "none";
  btn.textContent = `匯入經典酒譜（${missing.length} 道）`;
}

document.getElementById("importBtn").addEventListener("click", async () => {
  const btn = document.getElementById("importBtn");
  const missing = EXTRA_RECIPES.filter((x) => !recipes.some((r) => r.id === x.id));
  if (!missing.length) return;
  btn.disabled = true;
  let done = 0;
  for (const item of missing) {
    btn.textContent = `匯入中 ${done + 1}/${missing.length}...`;
    const result = await saveRemoteRecipe(item, password);
    if (!result.ok) {
      showToast("匯入失敗：" + (result.reason || "請稍後再試"));
      break;
    }
    recipes = [...recipes, item];
    done++;
  }
  btn.disabled = false;
  renderList();
  if (done) showToast(`已匯入 ${done} 道酒譜`);
});

function renderList() {
  updateImportBtn();
  const q =searchInput.value.trim().toLowerCase();
  const base = baseFilter.value;
  const items = recipes.filter((r) => {
    if (base && r.base !== base) return false;
    if (!q) return true;
    const hay = (r.name + " " + (r.ingredients || []).map((i) => i.name).join(" ")).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
  if (items.length === 0) {
    listEl.innerHTML = '<p class="empty-hint" style="grid-column:1/-1;">沒有符合的酒譜</p>';
    return;
  }
  listEl.innerHTML = items.map((r) => `
    <div class="recipe-card" data-id="${escapeHtml(r.id)}">
      ${r.image ? `<img class="thumb" src="${escapeHtml(r.image)}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
      <h3>${escapeHtml(r.name)}</h3>
      <div class="meta">${escapeHtml(r.base || "-")}・${escapeHtml(r.method || "-")}</div>
      <div class="meta">${escapeHtml(r.glass || "")}</div>
    </div>
  `).join("");
  listEl.querySelectorAll(".recipe-card").forEach((card) => {
    card.addEventListener("click", () => openDetail(card.dataset.id));
  });
}
searchInput.addEventListener("input", renderList);
baseFilter.addEventListener("change", renderList);

/* ---------- 調酒模式 ---------- */
function fmtNum(n) {
  return String(Math.round(n * 10) / 10);
}

function ingredientAmount(i) {
  if (i.amount === null || i.amount === undefined || i.amount === "") return escapeHtml(i.unit || "適量");
  return escapeHtml(fmtNum(Number(i.amount) * servings)) + " " + escapeHtml(i.unit || "");
}

function openDetail(id) {
  currentId = id;
  servings = 1;
  checked = new Set();
  listPanel.style.display = "none";
  editPanel.style.display = "none";
  detailPanel.style.display = "block";
  renderDetail();
  requestWakeLock();
  window.scrollTo({ top: 0 });
}

function closeDetail() {
  currentId = null;
  releaseWakeLock();
  detailPanel.style.display = "none";
  listPanel.style.display = "block";
}

function renderDetail() {
  const r = recipes.find((x) => x.id === currentId);
  if (!r) { closeDetail(); return; }
  const steps = String(r.steps || "").split("\n").map((s) => s.trim()).filter(Boolean);
  detailPanel.innerHTML = `
    <button type="button" class="secondary" id="backBtn">‹ 返回清單</button>
    <h2 class="mix-title" style="margin-top:16px;">${escapeHtml(r.name)}</h2>
    <div class="mix-meta">${escapeHtml(r.base || "")}・${escapeHtml(r.method || "")}・${escapeHtml(r.glass || "")}</div>
    ${r.image ? `<img class="mix-photo" src="${escapeHtml(r.image)}" alt="${escapeHtml(r.name)}" onerror="this.remove()" />` : ""}

    <div class="servings-box">
      <span>杯數</span>
      <button type="button" id="minusBtn">−</button>
      <input type="number" id="servingsInput" min="1" max="50" value="${servings}" />
      <button type="button" id="plusBtn">＋</button>
    </div>

    <div class="mix-section-title">材料（點選打勾）</div>
    <div>
      ${(r.ingredients || []).map((i, idx) => `
        <label class="ing-row ${checked.has(idx) ? "done" : ""}" data-idx="${idx}">
          <input type="checkbox" ${checked.has(idx) ? "checked" : ""} />
          <span>${escapeHtml(i.name)}</span>
          <span class="amt">${ingredientAmount(i)}</span>
        </label>
      `).join("")}
    </div>

    ${steps.length ? `<div class="mix-section-title">步驟</div><ol class="mix-steps">${steps.map((s) => `<li>${escapeHtml(s)}</li>`).join("")}</ol>` : ""}
    ${r.garnish ? `<div class="mix-section-title">裝飾</div><div style="font-size:1.15rem;">${escapeHtml(r.garnish)}</div>` : ""}
    ${r.notes ? `<div class="mix-section-title">備註</div><div style="font-size:1rem;color:var(--text-muted);">${escapeHtml(r.notes)}</div>` : ""}

    <div class="mix-actions">
      <button type="button" id="addToMenuBtn">加入酒單</button>
      <button type="button" class="secondary" id="editBtn">編輯</button>
      <button type="button" class="danger" id="deleteBtn">刪除</button>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", closeDetail);
  const setServings = (n) => {
    servings = Math.max(1, Math.min(50, Math.round(Number(n)) || 1));
    renderDetail();
  };
  document.getElementById("minusBtn").addEventListener("click", () => setServings(servings - 1));
  document.getElementById("plusBtn").addEventListener("click", () => setServings(servings + 1));
  document.getElementById("servingsInput").addEventListener("change", (e) => setServings(e.target.value));
  detailPanel.querySelectorAll(".ing-row").forEach((row) => {
    row.addEventListener("click", (e) => {
      e.preventDefault();
      const idx = Number(row.dataset.idx);
      if (checked.has(idx)) checked.delete(idx); else checked.add(idx);
      renderDetail();
    });
  });
  document.getElementById("addToMenuBtn").addEventListener("click", () => addRecipeToMenu(r));
  document.getElementById("editBtn").addEventListener("click", () => openEdit(r.id));
  document.getElementById("deleteBtn").addEventListener("click", () => deleteRecipe(r.id));
}

/* ---------- 加入酒單（公開菜單頁的「酒單」） ---------- */
async function addRecipeToMenu(r) {
  const btn = document.getElementById("addToMenuBtn");
  btn.disabled = true;
  btn.textContent = "處理中...";
  try {
    const remote = await fetchRemoteMenu();
    if (!remote) { showToast("讀取酒單失敗，請稍後再試"); return; }
    const list = remote.alcohol || [];
    if (list.some((i) => i.name === r.name)) {
      showToast("酒單裡已經有「" + r.name + "」");
      return;
    }
    const desc = (r.ingredients || []).map((i) => i.name).join("、");
    const item = { id: uid("m"), name: r.name, price: 0, desc, available: true, category: "調酒" };
    const result = await saveRemoteMenu("alcohol", [...list, item], password);
    if (result.ok) {
      showToast("已加入酒單（分類：調酒）");
    } else if (result.reason === "network") {
      // 回應逾時不代表寫入失敗，重新讀一次酒單確認是否其實已經加入成功
      const check = await fetchRemoteMenu();
      if (check && (check.alcohol || []).some((i) => i.id === item.id || i.name === r.name)) {
        showToast("已加入酒單（分類：調酒）");
      } else {
        showToast("加入失敗：連線逾時，請稍後再試");
      }
    } else {
      showToast("加入失敗：" + (result.reason || "請稍後再試"));
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "加入酒單";
  }
}

/* ---------- 新增／編輯／刪除 ---------- */
function ingredientsToText(list) {
  return (list || []).map((i) => {
    const amt = i.amount === null || i.amount === undefined || i.amount === "" ? "" : i.amount;
    return `${i.name} | ${amt} | ${i.unit || ""}`.replace(/\s*\|\s*\|\s*$/, "").replace(/\s*\|\s*$/, "");
  }).join("\n");
}

function parseIngredients(text) {
  return text.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
    const parts = line.split("|").map((p) => p.trim());
    const name = parts[0];
    let amount = null;
    let unit = parts[2] || "";
    if (parts[1]) {
      const n = parseFloat(parts[1]);
      if (isNaN(n)) unit = parts[1]; // 例如「適量」
      else amount = n;
    }
    return { name, amount, unit };
  });
}

function openEdit(id) {
  const r = id ? recipes.find((x) => x.id === id) : null;
  document.getElementById("editTitle").textContent = r ? "編輯酒譜" : "新增酒譜";
  document.getElementById("editId").value = r ? r.id : "";
  document.getElementById("fName").value = r ? r.name : "";
  document.getElementById("fBase").value = r && BASES.includes(r.base) ? r.base : "其它";
  document.getElementById("fMethod").value = r && METHODS.includes(r.method) ? r.method : "其它";
  document.getElementById("fGlass").value = r ? r.glass : "";
  document.getElementById("fIngredients").value = r ? ingredientsToText(r.ingredients) : "";
  document.getElementById("fSteps").value = r ? r.steps : "";
  document.getElementById("fGarnish").value = r ? r.garnish : "";
  document.getElementById("fNotes").value = r ? r.notes : "";
  document.getElementById("fImage").value = r ? r.image || "" : "";
  listPanel.style.display = "none";
  detailPanel.style.display = "none";
  editPanel.style.display = "block";
  window.scrollTo({ top: 0 });
}

document.getElementById("addBtn").addEventListener("click", () => openEdit(null));

function closeEdit() {
  editPanel.style.display = "none";
  if (currentId && recipes.some((r) => r.id === currentId)) {
    detailPanel.style.display = "block";
    renderDetail();
  } else {
    currentId = null;
    listPanel.style.display = "block";
    renderList();
  }
}
document.getElementById("cancelEditBtn").addEventListener("click", closeEdit);

document.getElementById("recipeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const saveBtn = document.getElementById("saveBtn");
  const existingId = document.getElementById("editId").value;
  const item = {
    id: existingId || uid("rc"),
    name: document.getElementById("fName").value.trim(),
    base: document.getElementById("fBase").value,
    method: document.getElementById("fMethod").value,
    glass: document.getElementById("fGlass").value.trim(),
    ingredients: parseIngredients(document.getElementById("fIngredients").value),
    steps: document.getElementById("fSteps").value.trim(),
    garnish: document.getElementById("fGarnish").value.trim(),
    notes: document.getElementById("fNotes").value.trim(),
    image: document.getElementById("fImage").value.trim(),
  };
  saveBtn.disabled = true;
  saveBtn.textContent = "儲存中...";
  const result = await saveRemoteRecipe(item, password);
  saveBtn.disabled = false;
  saveBtn.textContent = "儲存酒譜";
  if (!result.ok) {
    showToast(result.reason === "密碼錯誤" ? "密碼錯誤" : "儲存失敗：" + (result.reason || "請稍後再試"));
    return;
  }
  if (existingId) recipes = recipes.map((r) => (r.id === existingId ? item : r));
  else recipes = [...recipes, item];
  currentId = item.id;
  showToast("已儲存");
  closeEdit();
});

async function deleteRecipe(id) {
  if (!confirm("確定要刪除這道酒譜嗎？")) return;
  const result = await deleteRemoteRecipe(id, password);
  if (!result.ok) {
    showToast("刪除失敗：" + (result.reason || "請稍後再試"));
    return;
  }
  recipes = recipes.filter((r) => r.id !== id);
  showToast("已刪除");
  closeDetail();
  renderList();
}
</script>
